    background-repeat:no-repeat, repeat;
    background-position:center, center;
    background-size:cover, 110px 110px;
    background-attachment:fixed, fixed;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:920px;margin:0 auto;padding:0 14px 60px;}
  .hero{
    padding:20px 4px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:3px solid var(--ink);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:46px;width:auto;border-radius:6px;}
  .hero-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:30px;
    letter-spacing:0.2px;
    line-height:1;
    color:var(--ink);
    margin:0;
  }
  .hero-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .status-tag{
    position:relative;
    background:var(--mustard);
    color:var(--navy);
    font-family:var(--font-mono);
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px 8px 22px;
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 50%);
    white-space:nowrap;
  }
  .status-tag.off{background:var(--line-soft);color:var(--ink-soft);}
  .status-tag b{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:0.3px;}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .logout-link{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;}
  nav.tabs{
    display:flex;
    gap:6px;
    margin:16px 0 18px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  nav.tabs button{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    letter-spacing:0.2px;
    background:var(--paper-2);
    color:var(--ink-soft);
    border:2px solid var(--ink);
    border-bottom:none;
    padding:8px 16px 7px;
    cursor:pointer;
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
    flex:0 0 auto;
  }
  nav.tabs button.active{
    background:var(--card);
    color:var(--ink);
    position:relative;
  }
  nav.tabs button.active::after{
    content:'';
    position:absolute;
    left:0;right:0;bottom:-3px;
    height:3px;
    background:var(--card);
  }
  main{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:2px;
    padding:18px 16px 22px;
    position:relative;
  }
  h2.section-title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    letter-spacing:0.2px;
    margin:0 0 4px;
  }
  .section-note{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px;}
  .card{
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:2px;
    padding:14px;
    margin-bottom:12px;
  }
  .card-title{font-weight:600;font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1 1 140px;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  input, select, textarea{
    font-family:var(--font-body);
    font-size:14.5px;
    padding:8px 9px;
    border:1.5px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:var(--ink);
    width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--mustard);outline-offset:1px;}
  button.btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:2px;
    cursor:pointer;
  }
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}
  button.btn.primary{background:var(--mustard);border-color:var(--mustard-dark);color:var(--navy);}
  button.btn.ghost{background:transparent;color:var(--ink);}
  button.btn.danger{background:transparent;border-color:var(--brick);color:var(--brick);}
  button.btn.small{padding:5px 10px;font-size:12.5px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table th{text-align:left;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.4px;padding:5px 6px;border-bottom:2px solid var(--ink);}
  table td{padding:7px 6px;border-bottom:1px solid var(--line-soft);}
  .num{font-family:var(--font-mono);}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--font-mono);}
  .pill.ok{background:var(--green);color:var(--navy);}
  .pill.low{background:var(--brick);color:#1a0202;}
  .pill.mid{background:var(--warn);color:var(--navy);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){.grid2{grid-template-columns:1fr;}}
  .totalline{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;}
  .totalline.big{font-family:var(--font-display);font-weight:700;font-size:22px;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;}
  .muted{color:var(--ink-soft);}
  .empty{color:var(--ink-soft);font-style:italic;font-size:13.5px;padding:10px 0;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--mustard);color:var(--navy);padding:10px 18px;border-radius:3px;
    font-size:13.5px;font-weight:700;z-index:50;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .variant-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;flex-wrap:wrap;}
  .variant-row .vlabel{flex:1 1 auto;min-width:90px;}
  .stepper{display:flex;align-items:center;gap:6px;}
  .stepper button{width:24px;height:24px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:2px;cursor:pointer;font-weight:700;line-height:1;}
  .link-btn{background:none;border:none;color:var(--brick);cursor:pointer;font-size:12px;font-weight:600;padding:0;text-decoration:underline;}
  hr.stitch{border:none;border-top:1.5px dashed var(--line);margin:16px 0;}
  .top-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--paper);border:1.5px solid var(--line);border-radius:2px;padding:8px 12px;min-width:110px;}
  .stat .v{font-family:var(--font-mono);font-size:18px;font-weight:600;}
  .stat .l{font-size:11px;color:var(--ink-soft);}
  .cat-heading{font-family:var(--font-display);font-weight:700;font-size:18px;margin:18px 0 8px;letter-spacing:0.2px;}
  .cat-heading:first-child{margin-top:0;}
  .cat-chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;font-size:12.5px;margin:0 6px 6px 0;}
  .cat-chip button{background:none;border:none;color:var(--brick);cursor:pointer;font-size:14px;line-height:1;padding:0 4px;}
  .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
  .cat-scroll::-webkit-scrollbar{height:6px;}
  .cat-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .cat-scroll-chip{
    flex:0 0 auto;
    background:var(--paper);
    color:var(--ink-soft);
    border:1.5px solid var(--line);
    border-radius:20px;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-scroll-chip.active{background:var(--mustard);color:var(--navy);border-color:var(--mustard-dark);}

  .receipt-wrap{display:flex;justify-content:center;padding:30px 12px;min-height:100vh;background:var(--paper);}
  .receipt{background:#ffffff;color:#14181A;width:100%;max-width:340px;padding:22px 20px;border-radius:2px;box-shadow:var(--shadow);font-family:var(--font-mono);}
  .receipt-head{text-align:center;margin-bottom:10px;}
  .receipt-head img{height:38px;margin-bottom:6px;}
  .receipt-head .rname{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:0.3px;}
  .receipt-head .rmeta{font-size:11px;color:#5B6660;}
  .receipt hr{border:none;border-top:1.5px dashed #14181A;margin:10px 0;}
  .receipt table{width:100%;font-size:12px;border-collapse:collapse;}
  .receipt table td{padding:3px 0;border:none;}

    body{background:#fff !important;}
    .no-print{display:none !important;}
    .receipt-wrap{padding:0;min-height:auto;background:#fff;}

  .login-card{background:var(--card);border:2px solid var(--ink);border-radius:2px;padding:26px 24px;max-width:340px;width:100%;text-align:center;}
  .role-btn{display:block;width:100%;margin-bottom:10px;}
  .prod-desc{font-size:12px;color:var(--ink-soft);margin-top:-2px;}
</style>

let downloadsCap = null;
(async()=>{
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ downloadsCap = null; }
})();

async function descargarArchivo(filename, contenido, mime){
  if(downloadsCap){
    try{
      const res = await downloadsCap.save({filename, data: contenido});
      showToast(res.status==='saved' ? 'Archivo guardado' : 'Archivo enviado');
      return;
    }catch(err){
      if(err && err.code==='declined'){ showToast('Guardado cancelado'); return; }
      if(err && err.code==='rate_limited'){ showToast('Esperá un segundo y probá de nuevo'); return; }
    }
  }
  try{
    const blob = new Blob([contenido], {type: mime || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Archivo descargado');
  }catch(e){
    showToast('No se pudo descargar el archivo');
  }
}
const DEFAULT_CATEGORIAS = ["Pantalones","Jeans","Shorts","Medias","Cadenitas","Pulseras","Bolsos/Riñoneras","Gorras","Otros"];
const METODOS = ["Efectivo","Mercado Pago","Débito","Crédito"];
const LOW_STOCK = 3;

function defaultState(){
  return {
    config:{
      nombreLocal:"Zero Zed",
      debitoPct:10, creditoPct:20,
      categorias: DEFAULT_CATEGORIAS.slice(),
      pins: { admin:"1234", empleado:"0000" }
    },
    productos: [],
    ventas: [],
    turnos: [],
    compras: []
  };
}
let state;
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  state = raw ? JSON.parse(raw) : defaultState();
  if(!state.config.categorias) state.config.categorias = DEFAULT_CATEGORIAS.slice();
  if(!state.config.pins) state.config.pins = { admin:"1234", empleado:"0000" };
}catch(e){ state = defaultState(); }

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('No se pudo guardar', e); }
}

/* ---------- sesión / roles ---------- */
let session = null;
try{ session = sessionStorage.getItem('zz_session') || null; }catch(e){ session = null; }
let loginRoleSel = null;
let loginPin = '';
let loginError = '';

function iniciarSesion(){
  const pinCorrecto = state.config.pins[loginRoleSel];
  if(loginPin === pinCorrecto){
    session = loginRoleSel;
    try{ sessionStorage.setItem('zz_session', session); }catch(e){}
    loginRoleSel = null; loginPin=''; loginError='';
    if(session==='empleado' && (currentTab==='compras' || currentTab==='ajustes')) currentTab='vender';
    renderAll();
  }else{
    loginError = 'PIN incorrecto';
    renderAll();
  }
}
function cerrarSesion(){
  session = null;
  try{ sessionStorage.removeItem('zz_session'); }catch(e){}
  currentTab='vender';
  renderAll();
}

/* ---------- utilidades ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ n = Number(n)||0; return '$' + n.toLocaleString('es-AR',{minimumFractionDigits:0, maximumFractionDigits:0}); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function timeStr(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function fmtDate(s){ const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function sugerirTurno(){ const h = new Date().getHours(); return h < 15 ? 'Mañana' : 'Tarde'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function turnoAbierto(){ return state.turnos.find(t=>t.abierto); }
function ventasDe(fecha){ return state.ventas.filter(v=>v.fecha===fecha); }

/* ---------- navegación ---------- */
let currentTab = 'vender';
const ALL_TABS = [
  {id:'vender', label:'Vender', roles:['admin','empleado']},
  {id:'stock', label:'Stock', roles:['admin','empleado']},
  {id:'turno', label:'Turno', roles:['admin','empleado']},
  {id:'historial', label:'Historial', roles:['admin','empleado']},
  {id:'compras', label:'Compras', roles:['admin']},
  {id:'ajustes', label:'Ajustes', roles:['admin']}
];
function tabsPermitidas(){ return ALL_TABS.filter(t=>t.roles.includes(session)); }
function renderNav(){
  const nav = document.getElementById('tabsNav');
  if(!session){ nav.innerHTML=''; return; }
  nav.innerHTML = tabsPermitidas().map(t=>`<button class="${t.id===currentTab?'active':''}" onclick="goTab('${t.id}')">${t.label}</button>`).join('');
}
function goTab(id){ currentTab = id; renderAll(); }

function renderHeader(){
  document.getElementById('storeName').textContent = (state.config.nombreLocal || 'Zero Zed').toUpperCase();
  const hoy = todayStr();
  document.getElementById('dateLine').textContent = session ? (fmtDate(hoy) + ' · ' + ventasDe(hoy).length + ' venta(s) hoy · total ' + money(ventasDe(hoy).reduce((a,v)=>a+v.total,0))) : 'Control de stock y ventas';
  const t = turnoAbierto();
  const tag = document.getElementById('statusTag');
  const logoutBtn = document.getElementById('logoutBtn');
  if(!session){ tag.innerHTML=''; logoutBtn.style.display='none'; return; }
  logoutBtn.style.display='inline';
  logoutBtn.textContent = 'Salir (' + (session==='admin'?'Admin':'Empleado') + ')';
  if(t){
    tag.className='status-tag';
    tag.innerHTML = `<span>Turno abierto</span><b>${t.turno}</b>`;
  }else{
    tag.className='status-tag off';
    tag.innerHTML = `<span>Sin turno</span><b>Cerrado</b>`;
  }

function renderAll(){
  const appEl = document.getElementById('app');
  const overlay = document.getElementById('receiptOverlay');
  if(printVentaId){
    appEl.style.display = 'none';
    overlay.style.display = 'block';
    overlay.innerHTML = renderRecibo(printVentaId);
    return;
  }
  appEl.style.display = '';
  overlay.style.display = 'none';
  overlay.innerHTML = '';

  renderHeader();
  renderNav();
  const c = document.getElementById('content');
  if(!session){ c.innerHTML = renderLogin(); afterRenderHooks(); return; }
  const permitido = tabsPermitidas().some(t=>t.id===currentTab);
  if(!permitido) currentTab = 'vender';
  if(currentTab==='vender') c.innerHTML = renderVender();
  else if(currentTab==='stock') c.innerHTML = renderStock();
  else if(currentTab==='turno') c.innerHTML = renderTurno();
  else if(currentTab==='historial') c.innerHTML = renderHistorial();
  else if(currentTab==='compras') c.innerHTML = renderCompras();
  else if(currentTab==='ajustes') c.innerHTML = renderAjustes();
  afterRenderHooks();
}

/* =================== VENDER =================== */
let cart = [];
let ventaSelCat = '', ventaSelProd = '', ventaSelVar = '', ventaSelQty = 1, ventaMetodo = 'Efectivo', ventaSearch = '';

function renderVender(){
  const t = turnoAbierto();
  if(!t){
    return `
      <h2 class="section-title">Vender</h2>
      <p class="section-note">Para registrar ventas primero tenés que abrir un turno.</p>
      <div class="card">
        <p style="margin:0 0 10px;">No hay ningún turno abierto ahora mismo.</p>
        <button class="btn primary" onclick="goTab('turno')">Ir a abrir turno</button>
      </div>`;
  }

  const categorias = state.config.categorias;
  const productos = state.productos;
  const term = ventaSearch.trim().toLowerCase();
  let prodsFiltrados = ventaSelCat ? productos.filter(p=>p.categoria===ventaSelCat) : productos;
  if(term){
    prodsFiltrados = prodsFiltrados.filter(p=>
      p.nombre.toLowerCase().includes(term) ||
      (p.descripcion||'').toLowerCase().includes(term) ||
      p.categoria.toLowerCase().includes(term)
    );
  }
  const prodSel = productos.find(p=>p.id===ventaSelProd);
  const variantes = prodSel ? prodSel.variantes : [];
  const varSel = prodSel ? variantes.find(v=>v.id===ventaSelVar) : null;

  const subtotal = cart.reduce((a,i)=>a+i.cantidad*i.precioUnit,0);
  const pct = ventaMetodo==='Débito' ? state.config.debitoPct : ventaMetodo==='Crédito' ? state.config.creditoPct : 0;
  const recargo = Math.round(subtotal*pct/100);
  const total = subtotal + recargo;

  return `
  <h2 class="section-title">Vender</h2>
  <p class="section-note">Turno ${t.turno} en curso · agregá productos a la venta y elegí cómo paga.</p>
  ${ultimaVentaId ? `
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
    <span class="muted" style="font-size:13px;">Última venta registrada.</span>
    <button class="btn small primary" onclick="verComprobante('${ultimaVentaId}')">🧾 Ver comprobante</button>
  </div>` : ''}

  <div class="card">
    <div class="card-title">Agregar producto</div>
    <div class="row">
      <div class="field" style="flex:2 1 200px;">
        <label>Buscar</label>
        <input type="text" placeholder="Nombre, diseño o categoría..." value="${ventaSearch}" oninput="ventaSearch=this.value; ventaSelProd=''; ventaSelVar=''; renderAll();">
      </div>
      <div class="field">
        <label>Categoría</label>
        <select onchange="ventaSelCat=this.value; ventaSelProd=''; ventaSelVar=''; renderAll();">
          <option value="">Todas</option>
          ${categorias.map(c=>`<option value="${c}" ${ventaSelCat===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:2 1 220px;">
        <label>Producto ${term ? '('+prodsFiltrados.length+' resultado(s))' : ''}</label>
        <select onchange="ventaSelProd=this.value; ventaSelVar=''; renderAll();">
          <option value="">Elegí un producto</option>
          ${prodsFiltrados.map(p=>`<option value="${p.id}" ${ventaSelProd===p.id?'selected':''}>${p.nombre}${p.descripcion?(' — '+p.descripcion):''}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Talle / color</label>
        <select onchange="ventaSelVar=this.value; renderAll();" ${!prodSel?'disabled':''}>
          <option value="">Elegí variante</option>
          ${variantes.map(v=>`<option value="${v.id}" ${ventaSelVar===v.id?'selected':''} ${v.stock<=0?'disabled':''}>${v.talle} ${v.color} (stock ${v.stock})</option>`).join('')}
        </select>
      </div>
      <div class="field" style="max-width:90px;">
        <label>Cant.</label>
        <input type="number" min="1" value="${ventaSelQty}" onchange="ventaSelQty=parseInt(this.value)||1; renderAll();">
      </div>
    </div>
    <button class="btn primary" ${(!prodSel||!varSel)?'disabled':''} onclick="agregarAlCarrito()">+ Agregar a la venta</button>
  </div>

  <div class="card">
    <div class="card-title">Venta actual</div>
    ${cart.length===0 ? '<p class="empty">Todavía no agregaste productos.</p>' : `
    <table>
      <thead><tr><th>Producto</th><th>Variante</th><th>Cant.</th><th>P. unit.</th><th>Subtotal</th><th></th></tr></thead>
      <tbody>
        ${cart.map((i,idx)=>`
          <tr>
            <td>${i.nombre}</td>
            <td>${i.varianteLabel}</td>
            <td class="num">${i.cantidad}</td>
            <td class="num">${money(i.precioUnit)}</td>
            <td class="num">${money(i.cantidad*i.precioUnit)}</td>
            <td><button class="link-btn" onclick="quitarDelCarrito(${idx})">quitar</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`}

    <hr class="stitch">
    <div class="field" style="max-width:240px;">
      <label>Método de pago</label>
      <select onchange="ventaMetodo=this.value; renderAll();">
        ${METODOS.map(m=>`<option value="${m}" ${ventaMetodo===m?'selected':''}>${m}${(m==='Débito'||m==='Crédito') ? ' (+' + (m==='Débito'?state.config.debitoPct:state.config.creditoPct) + '%)' : ''}</option>`).join('')}
      </select>

    <div class="totalline"><span class="muted">Subtotal</span><span class="num">${money(subtotal)}</span></div>
    ${pct>0 ? `<div class="totalline"><span class="muted">Recargo ${ventaMetodo} (${pct}%)</span><span class="num">${money(recargo)}</span></div>` : ''}
    <div class="totalline big"><span>Total</span><span class="num">${money(total)}</span></div>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn primary" ${cart.length===0?'disabled':''} onclick="confirmarVenta()">Confirmar venta</button>
      <button class="btn ghost" ${cart.length===0?'disabled':''} onclick="cart=[]; renderAll();">Vaciar</button>
    </div>
  </div>
  `;
}

function agregarAlCarrito(){
  const p = state.productos.find(p=>p.id===ventaSelProd);
  if(!p) return;
  const v = p.variantes.find(v=>v.id===ventaSelVar);
  if(!v) return;
  const qty = Math.max(1, ventaSelQty||1);
  const yaEnCarrito = cart.filter(i=>i.varianteId===v.id).reduce((a,i)=>a+i.cantidad,0);
  if(yaEnCarrito + qty > v.stock){
    showToast('No hay stock suficiente (quedan '+v.stock+')');
    return;
  }
  cart.push({
    productoId:p.id, nombre:p.nombre + (p.descripcion?(' ('+p.descripcion+')'):''), categoria:p.categoria,
    varianteId:v.id, varianteLabel:[v.talle,v.color].filter(x=>x&&x!=='-').join(' / ')||'Único',
    cantidad:qty, precioUnit:p.precio
  });
  ventaSelQty = 1;
  renderAll();
}
function quitarDelCarrito(idx){ cart.splice(idx,1); renderAll(); }

function confirmarVenta(){
  const t = turnoAbierto();
  if(!t || cart.length===0) return;
  const subtotal = cart.reduce((a,i)=>a+i.cantidad*i.precioUnit,0);
  const pct = ventaMetodo==='Débito' ? state.config.debitoPct : ventaMetodo==='Crédito' ? state.config.creditoPct : 0;
  const recargo = Math.round(subtotal*pct/100);
  const total = subtotal + recargo;

  for(const item of cart){
    const p = state.productos.find(p=>p.id===item.productoId);
    const v = p.variantes.find(v=>v.id===item.varianteId);
    v.stock = Math.max(0, v.stock - item.cantidad);
  }

  const nuevaVenta = {
    id: uid(), fecha: todayStr(), hora: timeStr(), turnoId: t.id,
    items: cart.map(i=>({...i})), metodoPago: ventaMetodo,
    subtotal, recargoPct: pct, total
  };
  state.ventas.push(nuevaVenta);
  save();
  ultimaVentaId = nuevaVenta.id;
  cart = [];
  showToast('Venta registrada · ' + money(total));
  renderAll();
}

let nuevaVariante = {talle:'', color:'', stock:''};

function renderStock(){
  const categorias = state.config.categorias;
  if(!nuevoProd.categoria) nuevoProd.categoria = categorias[0] || '';

  const term = stockSearch.trim().toLowerCase();
  let productosFiltrados = state.productos;
  if(stockCategoryFilter) productosFiltrados = productosFiltrados.filter(p=>p.categoria===stockCategoryFilter);
  if(term){
    productosFiltrados = productosFiltrados.filter(p=>
      p.nombre.toLowerCase().includes(term) ||
      (p.descripcion||'').toLowerCase().includes(term) ||
      p.categoria.toLowerCase().includes(term)
    );
  }

  const porCategoria = {};
  categorias.forEach(c=>porCategoria[c]=[]);
  const sinCategoria = [];
  productosFiltrados.forEach(p=>{
    if(porCategoria[p.categoria]) porCategoria[p.categoria].push(p);
    else sinCategoria.push(p);

  return `

  <div class="field" style="max-width:340px;">

    <input type="text" placeholder="Nombre, diseño o categoría..." value="${stockSearch}" oninput="stockSearch=this.value; renderAll();">
  </div>
  <div class="cat-scroll">
    <button class="cat-scroll-chip ${stockCategoryFilter===''?'active':''}" onclick="stockCategoryFilter=''; renderAll();">Todas</button>
    ${categorias.map(c=>`<button class="cat-scroll-chip ${stockCategoryFilter===c?'active':''}" onclick="stockCategoryFilter='${c.replace(/'/g,"\\'")}'; renderAll();">${c}</button>`).join('')}

function renderProductoCard(p){
  const totalStock = p.variantes.reduce((a,v)=>a+v.stock,0);
  return `
  <div class="card">
    <div class="card-title">
      <span>${p.nombre} <span class="muted num" style="font-size:12px;">· costo ${money(p.costo)} · venta ${money(p.precio)}</span></span>
      <span class="pill ${totalStock<=0?'low':totalStock<=LOW_STOCK?'mid':'ok'}">${totalStock} en stock</span>
    </div>
    ${p.descripcion ? `<div class="prod-desc">${p.descripcion}</div>` : ''}
    ${p.variantes.length===0 ? '<p class="empty">Sin variantes cargadas todavía.</p>' : p.variantes.map(v=>`
      <div class="variant-row">
        <span class="vlabel">${v.talle||'-'} ${v.color?('· '+v.color):''}</span>
        <span class="pill ${v.stock<=0?'low':v.stock<=LOW_STOCK?'mid':'ok'}">${v.stock}</span>
        <div class="stepper">
          <button onclick="ajustarStock('${p.id}','${v.id}',-1)">−</button>
          <button onclick="ajustarStock('${p.id}','${v.id}',1)">+</button>
        </div>
        <button class="link-btn" onclick="eliminarVariante('${p.id}','${v.id}')">quitar</button>
      </div>
    `).join('')}
    <div class="row" style="margin-top:10px;">
      ${addVarianteFormFor===p.id ? `
        <div class="field" style="flex:1 1 90px;"><label>Talle</label><input type="text" value="${nuevaVariante.talle}" oninput="nuevaVariante.talle=this.value" placeholder="S, M, 40..."></div>
        <div class="field" style="flex:1 1 90px;"><label>Color</label><input type="text" value="${nuevaVariante.color}" oninput="nuevaVariante.color=this.value" placeholder="Negro..."></div>
        <div class="field" style="flex:1 1 70px;"><label>Stock</label><input type="number" min="0" value="${nuevaVariante.stock}" oninput="nuevaVariante.stock=this.value"></div>
        <div class="field" style="flex:0 0 auto;justify-content:flex-end;">
          <button class="btn small primary" onclick="guardarVariante('${p.id}')">Agregar</button>
        </div>
      ` : `<button class="btn small ghost" onclick="addVarianteFormFor='${p.id}'; nuevaVariante={talle:'',color:'',stock:''}; renderAll();">+ Talle/color</button>
      <button class="btn small danger" onclick="eliminarProducto('${p.id}')">Eliminar producto</button>`}
    </div>
  </div>`;
}

function crearProducto(){
  if(!nuevoProd.nombre.trim()){ showToast('Ponele un nombre al producto'); return; }
  state.productos.push({
    id: uid(), nombre: nuevoProd.nombre.trim(), descripcion: nuevoProd.descripcion.trim(),
    categoria: nuevoProd.categoria, costo: Number(nuevoProd.costo)||0, precio: Number(nuevoProd.precio)||0, variantes: []
  });
  save();
  nuevoProd = {nombre:'', descripcion:'', categoria: state.config.categorias[0]||'', costo:'', precio:''};
  showNuevoProducto = false;
  showToast('Producto creado');
  renderAll();
}
function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto y todas sus variantes?')) return;
  state.productos = state.productos.filter(p=>p.id!==id);
  save(); renderAll();
}
function guardarVariante(prodId){
  const p = state.productos.find(p=>p.id===prodId);
  if(!p) return;
  p.variantes.push({id:uid(), talle:nuevaVariante.talle.trim()||'Único', color:nuevaVariante.color.trim(), stock:Number(nuevaVariante.stock)||0});
  save();
  addVarianteFormFor = null;
  renderAll();
}
function eliminarVariante(prodId,varId){
  const p = state.productos.find(p=>p.id===prodId);
  if(!p) return;
  p.variantes = p.variantes.filter(v=>v.id!==varId);
  save(); renderAll();
}
function ajustarStock(prodId,varId,delta){
  const p = state.productos.find(p=>p.id===prodId);
  const v = p.variantes.find(v=>v.id===varId);
  v.stock = Math.max(0, v.stock+delta);
  save(); renderAll();
}

/* =================== TURNO =================== */
let nuevoTurno = {turno: sugerirTurno(), cambioInicial:''};
let nuevoGasto = {desc:'', monto:''};
let cerrandoTurno = false;
let cambioFinalInput = '';

function renderTurno(){
  const t = turnoAbierto();
  const cerrados = state.turnos.filter(t=>!t.abierto).sort((a,b)=> (b.fecha+b.horaApertura).localeCompare(a.fecha+a.horaApertura)).slice(0,6);

  if(!t){
    return `
    <h2 class="section-title">Turno</h2>
    <p class="section-note">Abrí el turno indicando con cuánto cambio empezás la caja.</p>
    <div class="card">
      <div class="row">
        <div class="field">
          <label>Turno</label>
          <select onchange="nuevoTurno.turno=this.value">
            <option ${nuevoTurno.turno==='Mañana'?'selected':''}>Mañana</option>
            <option ${nuevoTurno.turno==='Tarde'?'selected':''}>Tarde</option>
          </select>
        </div>
        <div class="field">
          <label>Cambio inicial</label>
          <input type="number" min="0" placeholder="0" value="${nuevoTurno.cambioInicial}" oninput="nuevoTurno.cambioInicial=this.value">
        </div>
      </div>
      <button class="btn primary" onclick="abrirTurno()">Abrir turno</button>
    </div>
    ${renderTurnosCerrados(cerrados)}
    `;
  }

  const ventasTurno = state.ventas.filter(v=>v.turnoId===t.id);
  const porMetodo = {};
  METODOS.forEach(m=>porMetodo[m]=0);
  ventasTurno.forEach(v=>porMetodo[v.metodoPago]+=v.total);
  const totalGastos = t.gastos.reduce((a,g)=>a+g.monto,0);
  const efectivoEsperado = Number(t.cambioInicial) + porMetodo['Efectivo'] - totalGastos;

  return `
  <h2 class="section-title">Turno ${t.turno}</h2>
  <p class="section-note">Abierto a las ${t.horaApertura} · cambio inicial ${money(t.cambioInicial)}</p>

  <div class="grid2">
    <div class="card">
      <div class="card-title">Ventas del turno</div>
      ${METODOS.map(m=>`<div class="totalline"><span class="muted">${m}</span><span class="num">${money(porMetodo[m])}</span></div>`).join('')}
      <div class="totalline big"><span>Total</span><span class="num">${money(ventasTurno.reduce((a,v)=>a+v.total,0))}</span></div>
    </div>
    <div class="card">
      <div class="card-title">Efectivo en caja</div>
      <div class="totalline"><span class="muted">Cambio inicial</span><span class="num">${money(t.cambioInicial)}</span></div>
      <div class="totalline"><span class="muted">+ Ventas efectivo</span><span class="num">${money(porMetodo['Efectivo'])}</span></div>
      <div class="totalline"><span class="muted">− Gastos</span><span class="num">${money(totalGastos)}</span></div>
      <div class="totalline big"><span>Esperado</span><span class="num">${money(efectivoEsperado)}</span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Gastos del turno <span class="muted" style="font-weight:400;font-size:12px;">(compras chicas, viáticos, etc.)</span></div>
    ${t.gastos.length===0 ? '<p class="empty">Sin gastos registrados.</p>' : `
    <table><thead><tr><th>Hora</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
    <tbody>${t.gastos.map((g,idx)=>`<tr><td>${g.hora}</td><td>${g.desc}</td><td class="num">${money(g.monto)}</td><td><button class="link-btn" onclick="quitarGasto('${t.id}',${idx})">quitar</button></td></tr>`).join('')}</tbody></table>`}
    <div class="row" style="margin-top:8px;">
      <div class="field" style="flex:2 1 160px;"><label>Descripción</label><input type="text" placeholder="Ej: galletitas" value="${nuevoGasto.desc}" oninput="nuevoGasto.desc=this.value"></div>
      <div class="field" style="flex:1 1 100px;"><label>Monto</label><input type="number" min="0" placeholder="0" value="${nuevoGasto.monto}" oninput="nuevoGasto.monto=this.value"></div>
      <div class="field" style="flex:0 0 auto;justify-content:flex-end;"><button class="btn small primary" onclick="agregarGasto('${t.id}')">Agregar gasto</button></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Cerrar turno</div>
    ${!cerrandoTurno ? `<button class="btn danger" onclick="cerrandoTurno=true; renderAll();">Cerrar turno</button>` : `
    <p class="section-note">Contá la caja y anotá cuánto efectivo hay realmente.</p>
    <div class="row">
      <div class="field" style="max-width:160px;"><label>Efectivo contado</label><input type="number" min="0" value="${cambioFinalInput}" oninput="cambioFinalInput=this.value"></div>
    </div>
    <p class="section-note">Esperado: ${money(efectivoEsperado)} ${cambioFinalInput!=='' ? '· Diferencia: ' + money(Number(cambioFinalInput)-efectivoEsperado) : ''}</p>
    <button class="btn primary" onclick="cerrarTurno('${t.id}', ${efectivoEsperado})">Confirmar cierre</button>
    <button class="btn ghost" onclick="cerrandoTurno=false; renderAll();">Cancelar</button>
    `}
  </div>

  ${renderTurnosCerrados(cerrados)}
  `;
}

function renderTurnosCerrados(cerrados){
  if(!cerrados.length) return '';
  return `
  <hr class="stitch">
  <h3 style="font-family:var(--font-display);font-weight:700;font-size:18px;margin:0 0 8px;">Turnos anteriores</h3>
  <table>
    <thead><tr><th>Fecha</th><th>Turno</th><th>Inicial</th><th>Contado</th><th>Diferencia</th><th>Gastos</th></tr></thead>
    <tbody>
      ${cerrados.map(t=>{
        const gastos = t.gastos.reduce((a,g)=>a+g.monto,0);
        const diff = (t.cambioFinal ?? 0) - (t.efectivoEsperado ?? 0);
        return `<tr>
          <td>${fmtDate(t.fecha)}</td><td>${t.turno}</td>
          <td class="num">${money(t.cambioInicial)}</td>
          <td class="num">${money(t.cambioFinal)}</td>
          <td class="num" style="color:${diff<0?'var(--brick)':diff>0?'var(--green)':'inherit'}">${money(diff)}</td>
          <td class="num">${money(gastos)}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function abrirTurno(){
  if(turnoAbierto()){ showToast('Ya hay un turno abierto'); return; }
  state.turnos.push({
    id: uid(), fecha: todayStr(), turno: nuevoTurno.turno,
    cambioInicial: Number(nuevoTurno.cambioInicial)||0, cambioFinal:null,
    gastos: [], abierto:true, horaApertura: timeStr(), horaCierre:null, efectivoEsperado:null
  });
  save();
  nuevoTurno = {turno: sugerirTurno(), cambioInicial:''};
  showToast('Turno abierto');
  renderAll();
}
function agregarGasto(turnoId){
  if(!nuevoGasto.desc.trim() || !nuevoGasto.monto){ showToast('Completá descripción y monto'); return; }
  const t = state.turnos.find(t=>t.id===turnoId);
  t.gastos.push({desc:nuevoGasto.desc.trim(), monto:Number(nuevoGasto.monto)||0, hora:timeStr()});
  save();
  nuevoGasto = {desc:'', monto:''};
  renderAll();
}
function quitarGasto(turnoId, idx){
  const t = state.turnos.find(t=>t.id===turnoId);
  t.gastos.splice(idx,1);
  save(); renderAll();
}
function cerrarTurno(turnoId, esperado){
  const t = state.turnos.find(t=>t.id===turnoId);
  t.abierto = false;
  t.cambioFinal = Number(cambioFinalInput)||0;
  t.efectivoEsperado = esperado;
  t.horaCierre = timeStr();
  save();
  cerrandoTurno = false; cambioFinalInput='';
  showToast('Turno cerrado');
  renderAll();
}

/* =================== HISTORIAL =================== */
let historialFecha = todayStr();

function renderHistorial(){
  const ventas = ventasDe(historialFecha);
  const turnosDia = state.turnos.filter(t=>t.fecha===historialFecha);
  const porMetodo = {}; METODOS.forEach(m=>porMetodo[m]=0);
  ventas.forEach(v=>porMetodo[v.metodoPago]+=v.total);

  const ranking = {};
  ventas.forEach(v=>v.items.forEach(i=>{
    const key = i.nombre + (i.varianteLabel?(' · '+i.varianteLabel):'');
    ranking[key] = ranking[key] || {cantidad:0, total:0};
    ranking[key].cantidad += i.cantidad;
    ranking[key].total += i.cantidad*i.precioUnit;
  }));
  const rankingArr = Object.entries(ranking).sort((a,b)=>b[1].cantidad-a[1].cantidad).slice(0,10);

  return `
  <h2 class="section-title">Historial</h2>
  <div class="field" style="max-width:200px;">
    <label>Fecha</label>
    <input type="date" value="${historialFecha}" onchange="historialFecha=this.value; renderAll();">
  </div>

  <div class="top-summary">
    <div class="stat"><div class="v">${money(ventas.reduce((a,v)=>a+v.total,0))}</div><div class="l">Total vendido</div></div>
    <div class="stat"><div class="v">${ventas.length}</div><div class="l">Ventas</div></div>
    ${METODOS.map(m=>`<div class="stat"><div class="v">${money(porMetodo[m])}</div><div class="l">${m}</div></div>`).join('')}
  </div>

  <div class="card">
    <div class="card-title">Más vendido ese día</div>
    ${rankingArr.length===0 ? '<p class="empty">Sin ventas ese día.</p>' : `
    <table><thead><tr><th>Producto</th><th>Cantidad</th><th>Total</th></tr></thead>
    <tbody>${rankingArr.map(([k,v])=>`<tr><td>${k}</td><td class="num">${v.cantidad}</td><td class="num">${money(v.total)}</td></tr>`).join('')}</tbody></table>`}
  </div>

  <div class="card">
    <div class="card-title">Detalle de ventas</div>
    ${ventas.length===0 ? '<p class="empty">Sin ventas registradas.</p>' : ventas.slice().reverse().map(v=>`
      <div style="padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <b>${v.hora} · ${v.metodoPago}</b>
          <span style="display:flex;align-items:center;gap:10px;">
            <span class="num">${money(v.total)}</span>
            <button class="link-btn" style="color:var(--mustard);" onclick="verComprobante('${v.id}')">comprobante</button>
          </span>
        </div>
        <div class="muted">${v.items.map(i=>i.cantidad+'x '+i.nombre+(i.varianteLabel?(' ('+i.varianteLabel+')'):'')).join(', ')}</div>
      </div>
    `).join('')}
  </div>

  ${turnosDia.length ? `
  <div class="card">
    <div class="card-title">Turnos del día</div>
    <table><thead><tr><th>Turno</th><th>Inicial</th><th>Contado</th><th>Gastos</th><th>Estado</th></tr></thead>
    <tbody>${turnosDia.map(t=>`<tr><td>${t.turno}</td><td class="num">${money(t.cambioInicial)}</td><td class="num">${t.cambioFinal!=null?money(t.cambioFinal):'-'}</td><td class="num">${money(t.gastos.reduce((a,g)=>a+g.monto,0))}</td><td>${t.abierto?'Abierto':'Cerrado'}</td></tr>`).join('')}</tbody></table>
  </div>` : ''}
  `;
}

function renderCompras(){

        <label>Producto</label>
        <select onchange="nuevaCompra.productoId=this.value; nuevaCompra.varianteId=''; renderAll();">

          ${state.productos.map(p=>`<option value="${p.id}" ${nuevaCompra.productoId===p.id?'selected':''}>${p.nombre}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:1 1 160px;">
        <label>Variante</label>
        <select onchange="nuevaCompra.varianteId=this.value" ${!prod?'disabled':''}>
          <option value="">Elegí variante</option>
          ${prod ? prod.variantes.map(v=>`<option value="${v.id}" ${nuevaCompra.varianteId===v.id?'selected':''}>${v.talle} ${v.color}</option>`).join('') : ''}
        </select>
      </div>
      <div class="field" style="max-width:110px;"><label>Cantidad</label><input type="number" min="0" value="${nuevaCompra.cantidad}" oninput="nuevaCompra.cantidad=this.value"></div>

    ${compras.length===0 ? '<p class="empty">Todavía no registraste compras.</p>' : `

    <tbody>${compras.map(c=>`<tr><td>${fmtDate(c.fecha)}</td><td>${c.descripcion}${c.notas?('<br><span class="muted" style="font-size:11.5px;">'+c.notas+'</span>'):''}</td><td>${c.proveedor||'-'}</td><td class="num">${money(c.costo)}</td><td><button class="link-btn" onclick="eliminarCompra('${c.id}')">eliminar</button></td></tr>`).join('')}</tbody></table>`}

function registrarCompra(){
  if(!nuevaCompra.descripcion.trim()){ showToast('Contame qué compraste'); return; }
  state.compras.push({
    id: uid(), fecha: nuevaCompra.fecha, descripcion: nuevaCompra.descripcion.trim(),
    proveedor: nuevaCompra.proveedor.trim(), costo: Number(nuevaCompra.costo)||0,
    notas: nuevaCompra.notas.trim(), productoId: nuevaCompra.productoId||null, varianteId: nuevaCompra.varianteId||null,
    cantidad: Number(nuevaCompra.cantidad)||0
  });
  if(nuevaCompra.productoId && nuevaCompra.varianteId && Number(nuevaCompra.cantidad)>0){
    const p = state.productos.find(p=>p.id===nuevaCompra.productoId);
    const v = p.variantes.find(v=>v.id===nuevaCompra.varianteId);
    v.stock += Number(nuevaCompra.cantidad);
    showToast('Compra registrada y stock actualizado');
  }else{
    showToast('Compra registrada');
  }
  save();
  nuevaCompra = {fecha: todayStr(), descripcion:'', proveedor:'', costo:'', notas:'', productoId:'', varianteId:'', cantidad:''};
  renderAll();
}
function eliminarCompra(id){
  const c = state.compras.find(c=>c.id===id);
  if(!c) return;
  if(!confirm('¿Eliminar esta compra del historial?')) return;
  if(c.productoId && c.varianteId && c.cantidad>0){
    if(confirm('Esta compra había sumado '+c.cantidad+' unidades de stock. ¿Querés restarlas también del stock actual?')){
      const p = state.productos.find(p=>p.id===c.productoId);
      const v = p ? p.variantes.find(v=>v.id===c.varianteId) : null;
      if(v) v.stock = Math.max(0, v.stock - c.cantidad);
    }
  }
  state.compras = state.compras.filter(x=>x.id!==id);
  save();
  showToast('Compra eliminada');
  renderAll();
}

/* =================== AJUSTES (solo admin) =================== */
let nuevaCategoria = '';

function renderAjustes(){
  return `
  <h2 class="section-title">Ajustes</h2>

  <div class="card">
    <div class="card-title">Datos del local</div>
    <div class="field" style="max-width:280px;">
      <label>Nombre del local</label>
      <input type="text" value="${state.config.nombreLocal}" onchange="state.config.nombreLocal=this.value; save(); renderAll();">
    </div>
  </div>

  <div class="card">
    <div class="card-title">Categorías de productos</div>
    <div style="margin-bottom:10px;">
      ${state.config.categorias.map(c=>`<span class="cat-chip">${c}<button onclick="eliminarCategoria('${c.replace(/'/g,"\\'")}')" title="Eliminar">×</button></span>`).join('')}
    </div>
    <div class="row">
      <div class="field" style="flex:1 1 200px;"><input type="text" placeholder="Nueva categoría" value="${nuevaCategoria}" oninput="nuevaCategoria=this.value" onkeydown="if(event.key==='Enter') agregarCategoria();"></div>
      <div class="field" style="flex:0 0 auto;"><button class="btn small primary" onclick="agregarCategoria()">Agregar</button></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Recargos por método de pago</div>
    <p class="section-note" style="margin-top:-4px;">Efectivo y Mercado Pago se cobran al mismo precio, sin recargo.</p>
    <div class="row">
      <div class="field" style="max-width:160px;">
        <label>Recargo Débito (%)</label>
        <input type="number" min="0" value="${state.config.debitoPct}" onchange="state.config.debitoPct=Number(this.value)||0; save(); renderAll();">
      </div>
      <div class="field" style="max-width:160px;">
        <label>Recargo Crédito (%)</label>
        <input type="number" min="0" value="${state.config.creditoPct}" onchange="state.config.creditoPct=Number(this.value)||0; save(); renderAll();">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">PIN de acceso</div>
    <p class="section-note" style="margin-top:-4px;">Ojo: esto es solo un filtro simple para separar accesos, no es una contraseña con seguridad real (cualquiera con el archivo podría inspeccionar el código). No lo uses para proteger algo crítico.</p>
    <div class="row">
      <div class="field" style="max-width:160px;">
        <label>PIN Admin</label>
        <input type="text" value="${state.config.pins.admin}" onchange="state.config.pins.admin=this.value; save();">
      </div>
      <div class="field" style="max-width:160px;">
        <label>PIN Empleado</label>
        <input type="text" value="${state.config.pins.empleado}" onchange="state.config.pins.empleado=this.value; save();">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Copia de seguridad</div>
    <p class="section-note" style="margin-top:-4px;">Los datos se guardan solo en este dispositivo/navegador. Descargá una copia de vez en cuando por las dudas.</p>
    <div class="row">
      <button class="btn" onclick="exportarDatos()">Descargar copia (.json)</button>
      <label class="btn ghost" style="cursor:pointer;">Importar copia
        <input type="file" accept="application/json" style="display:none;" onchange="importarDatos(event)">
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Zona de riesgo</div>
    <button class="btn danger" onclick="borrarTodo()">Borrar todos los datos</button>
  </div>
  `;
}

function agregarCategoria(){
  const val = nuevaCategoria.trim();
  if(!val) return;
  if(state.config.categorias.some(c=>c.toLowerCase()===val.toLowerCase())){ showToast('Esa categoría ya existe'); return; }
  state.config.categorias.push(val);
  save();
  nuevaCategoria = '';
  renderAll();
}
function eliminarCategoria(cat){
  const enUso = state.productos.some(p=>p.categoria===cat);
  const msg = enUso ? 'Hay productos cargados en esta categoría; van a quedar sin categoría asignada. ¿Eliminar igual?' : '¿Eliminar esta categoría?';
  if(!confirm(msg)) return;
  state.config.categorias = state.config.categorias.filter(c=>c!==cat);
  save();
  renderAll();
}

function exportarDatos(){
  const contenido = JSON.stringify(state,null,2);
  descargarArchivo('zero-zed-backup-'+todayStr()+'.json', contenido, 'application/json');
}
function importarDatos(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.productos || !data.ventas) throw new Error('formato inválido');
      if(!data.config.categorias) data.config.categorias = DEFAULT_CATEGORIAS.slice();
      if(!data.config.pins) data.config.pins = { admin:"1234", empleado:"0000" };
      state = data;
      save();
      showToast('Datos importados');
      renderAll();
    }catch(e){
      showToast('El archivo no es una copia válida');
    }
  };
  reader.readAsText(file);
}
function borrarTodo(){
  if(!confirm('Esto borra todo: productos, ventas, turnos y compras. ¿Seguro?')) return;
  if(!confirm('Última confirmación: no se puede deshacer. ¿Borrar todo?')) return;
  state = defaultState();
  save();
  showToast('Datos borrados');
  renderAll();
}

function afterRenderHooks(){}

renderAll();
</script>
</body>
</html>
